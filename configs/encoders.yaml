# Encoder fine-tuning
models:
  mentalroberta: mental/mental-roberta-base
  roberta: roberta-base
  mentalbert: mental/mental-bert-base-uncased
  bert: bert-base-uncased
order: [mentalroberta, roberta, mentalbert, bert]
max_len: 512
head_tokens: 128          # head+tail truncation: first 128 + last (max_len - 2 - 128) tokens
lr: 2.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
batch_size: 8
grad_accum: 2             # effective batch 16
eval_batch_size: 32
max_epochs: 6
patience: 2
fp16: true
keep_models:              # best seed kept for XAI (Phase 6)
  - [mentalroberta, depsign, orig]
  - [mentalroberta, depsign, mask-topic]
